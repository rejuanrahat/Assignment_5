<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <title>GitHub Issues Tracker</title>
</head>

<body class="bg-gray-100 min-h-screen">

    <section id="login-page" class="flex items-center justify-center min-h-screen">
        <div class="card w-96 bg-white shadow-xl border p-6 text-center">
            <img src="./assets/github-logo.png" alt="" class="w-16 h-16 mx-auto mb-2">
            <h2 class="text-2xl font-bold">Issues Tracker</h2>
            <p class="text-gray- text-sm mb-6">Sign in to manage your issues</p>

            <div class="form-control mb-4 text-left">
                <label class="label"><span class="label-text font-bold">Username</span></label>
                <input type="text" id="username" placeholder="admin" class="input input-bordered w-full">
            </div>
            <div class="form-control mb-4 text-left">
                <label class="label"><span class="label-text font-bold">Password</span></label>
                <input type="password" id="password" placeholder="admin123" class="input input-bordered w-full">
            </div>
            <button id="login-btn" class="btn btn-primary w-full text-white font-bold">Sign In</button>
            <div class="mt-6 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-xs">
                <p>username: <strong>admin</strong></p>
                <p>password: <strong>admin123</strong></p>
            </div>
        </div>
    </section>


    <section id="main-page" class="hidden">
        <div class="navbar bg-white border-b px-4 md:px-12 sticky top-0 z-50">
            <div class="flex-1">
                <a class="text-xl font-bold flex items-center gap-2">
                    <img src="./assets/github-logo.png" alt="" class="w-8 h-8">
                    <span class="hidden sm:inline">Issues Tracker</span>
                </a>
            </div>
            <div class="flex-none">
                <div class="join">
                    <div class="relative flex items-center">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                        <input type="text" id="search-input" placeholder="Search title..." class="input input-bordered join-item pl-9 w-32 md:w-64 focus:outline-none">
                    </div>
                    <button id="search-btn" class="btn btn-primary join-item text-white">Search</button>
                </div>
            </div>
        </div>
    </section>

    <script src="scripts/index.js"></script>
</body>

</html>
