<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <title>GitHub Issues Tracker</title>
</head>

<body class="bg-gray-100 min-h-screen">

    <section id="login-page" class="flex items-center justify-center min-h-screen">
        <div class="card w-96 bg-white shadow-xl border p-6 text-center">
            <img src="./assets/github-logo.png" alt="" class="w-16 h-16 mx-auto mb-2">
            <h2 class="text-2xl font-bold">Issues Tracker</h2>
            <p class="text-gray- text-sm mb-6">Sign in to manage your issues</p>

            <div class="form-control mb-4 text-left">
                <label class="label"><span class="label-text font-bold">Username</span></label>
                <input type="text" id="username" placeholder="admin" class="input input-bordered w-full">
            </div>
            <div class="form-control mb-4 text-left">
                <label class="label"><span class="label-text font-bold">Password</span></label>
                <input type="password" id="password" placeholder="admin123" class="input input-bordered w-full">
            </div>
            <button id="login-btn" class="btn btn-primary w-full text-white font-bold">Sign In</button>
            <div class="mt-6 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-xs">
                <p>username: <strong>admin</strong></p>
                <p>password: <strong>admin123</strong></p>
            </div>
        </div>
    </section>


    <section id="main-page" class="hidden">
        <div class="navbar bg-white border-b px-4 md:px-12 sticky top-0 z-50">
            <div class="flex-1">
                <a class="text-xl font-bold flex items-center gap-2">
                    <img src="./assets/github-logo.png" alt="" class="w-8 h-8">
                    <span class="hidden sm:inline">Issues Tracker</span>
                </a>
            </div>
            <div class="flex-none">
                <div class="join">
                    <div class="relative flex items-center">
                        <i
                            class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                        <input type="text" id="search-input" placeholder="Search title..."
                            class="input input-bordered join-item pl-9 w-32 md:w-64 focus:outline-none">
                    </div>
                    <button id="search-btn" class="btn btn-primary join-item text-white">Search</button>
                </div>
            </div>
        </div>

        <main class="max-w-7xl mx-auto p-6">

            <div class="flex justify-center gap-2 mb-8">
                <button onclick="filterBy('all')" id="btn-all"
                    class="btn btn-sm md:btn-md btn-primary px-8 font-bold">All</button>
                <button onclick="filterBy('open')" id="btn-open"
                    class="btn btn-sm md:btn-md btn-outline px-8 font-bold">Open</button>
                <button onclick="filterBy('closed')" id="btn-closed"
                    class="btn btn-sm md:btn-md btn-outline px-8 font-bold">Closed</button>
            </div>

            <div class="flex items-center justify-between mb-8 bg-white p-6 rounded-lg border shadow-sm">
                <div class="flex items-center gap-4">
                    <div class="bg-indigo-100 p-4 rounded-full text-indigo-600">
                        <img src="./assets/Aperture.png" alt="" class="text-2xl">
                    </div>
                    <div>
                        <h2 id="total-count" class="text-2xl font-bold text-indigo-900">0 Issues</h2>
                        <p class="text-gray-500 text-sm">Real-time issues tracking dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 px-4 py-2 rounded-full"
                        style="background:#dcfce7; border:1px solid #86efac;">
                        <i class="far fa-circle text-green-600 text-sm"></i>
                        <span class="font-bold text-green-700 text-sm">open</span>
                    </div>
                    <div class="flex items-center gap-2 px-4 py-2 rounded-full"
                        style="background:#f3e8ff; border:1px solid #d8b4fe;">
                        <i class="fas fa-check-circle text-purple-600 text-sm"></i>
                        <span class="font-bold text-green-700 text-sm">closed</span>
                    </div>
                </div>
            </div>

            <div id="loader" class="hidden text-center py-20">
                <span class="loading loading-spinner loading-lg text-primary"></span>
                <p class="mt-2 text-gray-400 font-medium">Fetching Data...</p>
            </div>

            <div id="issues-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </main>
    </section>

    <dialog id="details_modal" class="modal">
        <div class="modal-box max-w-3xl bg-white p-10 rounded-2xl shadow-2xl">

            <div class="flex flex-wrap gap-2 mb-2" id="m-category-tags"></div>

            <h3 id="m-title" class="font-bold text-[28px] mb-4 text-[#1a1e2b]"></h3>

            <div class="flex items-center gap-5 mb-5">
                <span id="m-status-badge" class="text-sm font-bold flex items-center"></span>
                <span id="m-date" class="text-sm text-gray-400 flex items-center gap-2"></span>
            </div>

            <div class="flex flex-wrap gap-2 mb-6" id="m-tags"></div>

            <p id="m-desc" class="text-gray-600 mb-8 leading-relaxed text-[15px] border-b pb-8 border-gray-100"></p>

            <div class="grid grid-cols-3 gap-6 p-5 bg-white rounded-xl border border-gray-200 mt-4">
                <div>
                    <p class="text-[11px] text-gray-400 uppercase font-bold tracking-wider mb-2">Author</p>
                    <p id="m-author" class="font-bold text-[#1a1e2b] text-[15px] flex items-center gap-2"></p>
                </div>
                <div>
                    <p class="text-[11px] text-gray-400 uppercase font-bold tracking-wider mb-2">Priority</p>
                    <p id="m-priority" class="font-bold text-[#1a1e2b] text-[15px] capitalize"></p>
                </div>
                <div>
                    <p class="text-[11px] text-gray-400 uppercase font-bold tracking-wider mb-2">Assignee</p>
                    <p id="m-assignee" class="font-bold text-[#1a1e2b] text-[15px] flex items-center gap-2"></p>
                </div>
            </div>

            <div class="modal-action mt-8 flex justify-end">
                <form method="dialog">
                    <button
                        class="btn bg-[#4f00ff] hover:bg-[#3b00cc] text-white border-2 border-white outline outline-2 outline-[#4f00ff] rounded-lg px-12 py-2 min-h-0 h-auto font-bold">Close</button>
                </form>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop bg-black/30">
            <button>Close</button>
        </form>
    </dialog>


    <script src="scripts/index.js"></script>
</body>

</html>
